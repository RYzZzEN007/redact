<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Redact — choose who to blur in a video</title>
    <meta name="description" content="Upload a clip and choose exactly who to anonymize. Redact finds everyone, groups each person, and blurs only who you pick. Nothing is stored." />
    <link rel="canonical" href="https://redact.codes/" />

    <!-- Open Graph (LinkedIn, Facebook, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://redact.codes/" />
    <meta property="og:title" content="Redact — selective face anonymization for video" />
    <meta property="og:description" content="Blur this person, not that one. Upload a clip, pick who to anonymize, download the result. Nothing is stored." />
    <meta property="og:image" content="https://redact.codes/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Redact — selective face anonymization for video" />
    <meta name="twitter:description" content="Blur this person, not that one. Upload a clip, pick who to anonymize, download. Nothing is stored." />
    <meta name="twitter:image" content="https://redact.codes/og-image.png" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
