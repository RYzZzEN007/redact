# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - redact-ryzzzen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: redactacr16238.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DFB21433B341438B95A3A20146AA0FEC }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_457E1FF8B5E642DB917CF9559FA198E6 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: redactacr16238.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DFB21433B341438B95A3A20146AA0FEC }}/redact:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D1A55FE2EBAB471DA8D61FCD6C53E4D3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D34FED6FF5DC4F17965B19102C533CBA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E93596BF28D8451CB6A24551DBDFC5DB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'redact-ryzzzen'
          slot-name: 'Production'
          images: 'redactacr16238.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DFB21433B341438B95A3A20146AA0FEC }}/redact:${{ github.sha }}'
          